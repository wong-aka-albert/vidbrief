<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vidbrief 校准对照表</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --line: #2b3038; --fg: #d8dee9; --dim: #7b8494;
    --accent: #4aa3ff; --keep: #3fb950; --drop: #6e7681;
    --hover: #ffffff08; --seg-fixed: #3fb95055;
    --ctl-bg: #232830; --ctl-bg-hover: #2e343d;
    --warn: #d29922; --bad: #f85149;
  }
  :root[data-theme="light"] {
    --bg: #f6f7f9; --panel: #ffffff; --line: #e3e6ea; --fg: #1f2328; --dim: #656d76;
    --accent: #0969da; --keep: #1a7f37; --drop: #8c959f;
    --hover: #0000000a; --seg-fixed: #1a7f3729;
    --ctl-bg: #eef0f3; --ctl-bg-hover: #e3e6ea;
    --warn: #9a6700; --bad: #cf222e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.55 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .meta { color: var(--dim); font-size: 12px; }
  header .spacer { flex: 1; }
  header a { color: var(--accent); text-decoration: none; font-size: 12px; }
  header a:hover { text-decoration: underline; }
  button.tool {
    font: inherit; font-size: 12px; color: var(--fg); background: var(--ctl-bg);
    border: 1px solid var(--line); border-radius: 5px; padding: 3px 9px; cursor: pointer;
  }
  button.tool:hover { background: var(--ctl-bg-hover); }
  main { padding: 16px 18px 60px; max-width: 1600px; margin: 0 auto; }

  #warn { display: none; margin: 0 0 14px; padding: 8px 12px; border: 1px solid var(--warn);
    border-radius: 6px; color: var(--warn); font-size: 12px; }
  #warn.show { display: block; }

  section { margin-bottom: 34px; }
  h2 { font-size: 14px; margin: 0 0 4px; }
  h2 .counts { color: var(--dim); font-weight: 400; font-size: 12px; margin-left: 8px; }
  .hint { color: var(--dim); font-size: 12px; margin: 0 0 10px; }
  .filters { display: flex; gap: 6px; margin: 0 0 12px; flex-wrap: wrap; }
  .filters button.on { border-color: var(--accent); color: var(--accent); }

  /* ── 截图卡片:缩略图按时刻并排 —— 空的、同一张幻灯片,一眼看得出来 ── */
  #shotGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px; }
  .shot { border: 1px solid var(--line); border-radius: 6px; background: var(--panel);
    overflow: hidden; display: flex; flex-direction: column; }
  .shot .thumb { height: 128px; background: #000; display: grid; place-items: center;
    cursor: zoom-in; }
  .shot .thumb img { max-width: 100%; max-height: 128px; display: block; }
  .shot .body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 5px; }
  .shot .head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .shot .head .id { font-weight: 600; }
  .shot .head .t { color: var(--accent); font-variant-numeric: tabular-nums; }
  .shot .head .origin { color: var(--dim); font-size: 11px; }
  .shot.dropped { border-color: var(--drop); opacity: .78; }
  .shot.dropped .thumb { cursor: zoom-in; filter: grayscale(.5); }
  .shot.low { border-color: var(--warn); }
  .shot.nomatch { border-color: var(--bad); }

  .badge { display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 9px;
    border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
  .badge.ok { color: var(--keep); border-color: var(--keep); }
  .badge.warn { color: var(--warn); border-color: var(--warn); }
  .badge.bad { color: var(--bad); border-color: var(--bad); }
  .badge.dim { color: var(--dim); }

  .kv { font-size: 12px; color: var(--fg); }
  .kv .k { color: var(--dim); }
  .issues { margin: 0; padding: 0 0 0 18px; font-size: 12px; color: var(--warn); }
  .quote { font-size: 12px; color: var(--dim); border-left: 2px solid var(--line);
    padding-left: 8px; }
  .at { color: var(--dim); font-size: 11px; }

  /* ── 转录行 ── */
  #segList { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .seg { display: grid; grid-template-columns: 118px 86px 1fr; gap: 10px;
    padding: 7px 4px; border-bottom: 1px solid var(--line); align-items: baseline; }
  .seg:hover { background: var(--hover); }
  .seg .where { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .seg .tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .seg .what .line { display: block; }
  .seg .old { color: var(--dim); text-decoration: line-through; }
  .seg .new { color: var(--keep); }
  .seg .why { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .seg .at { margin-top: 2px; display: block; }
  .seg.unchecked { opacity: .55; }
  .seg.needs_user { background: color-mix(in srgb, var(--warn) 8%, transparent); }
  .seg .what { min-width: 0; overflow-wrap: anywhere; }

  /* ── 校准日志 ── */
  #log { white-space: pre-wrap; word-break: break-word; background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px;
    font: 12px/1.7 ui-monospace, Consolas, monospace; color: var(--fg); margin: 0; }

  /* ── 点图放大 ── */
  #zoom { position: fixed; inset: 0; background: #000c; display: none;
    place-items: center; z-index: 50; cursor: zoom-out; }
  #zoom.show { display: grid; }
  #zoom img { max-width: 94vw; max-height: 90vh; }
  #zoom .cap { color: #fff; font-size: 12px; margin-top: 8px; text-align: center; }

  @media (max-width: 720px) {
    .seg { grid-template-columns: 1fr; gap: 2px; }
  }
</style>
</head>
<body>
<header>
  <h1 id="pname">…</h1>
  <span class="meta" id="pmeta"></span>
  <span class="spacer"></span>
  <a id="timelineLink" href="#">时间线视图(带视频回跳)→</a>
  <button class="tool" id="themeBtn" title="切换亮色/暗色">🌙</button>
</header>
<main>
  <div id="warn"></div>

  <section id="shotsSec">
    <h2>截图<span class="counts" id="shotCounts"></span></h2>
    <p class="hint">按时刻并排 —— 哪张是空的、哪几张是同一张幻灯片,直接看缩略图;弃用与没把握的已标出。</p>
    <div class="filters" id="shotFilters"></div>
    <div id="shotGrid"></div>
  </section>

  <section id="segsSec">
    <h2>转录<span class="counts" id="segCounts"></span></h2>
    <p class="hint">原文与现在的读法并排;改过 / 决定不改 / 存疑未改各有标记,还没核验的淡显。</p>
    <div class="filters" id="segFilters"></div>
    <div id="segList"></div>
  </section>

  <section id="logSec">
    <h2>校准日志</h2>
    <p class="hint">每条结论上都标了写下的时刻;对照这里每轮的时间段,就知道那条结论是哪一轮写的。同一处的结论被后轮改写时,旧的那句只在这份日志里。</p>
    <pre id="log"></pre>
  </section>
</main>

<div id="zoom"><div><img id="zoomImg" alt=""><div class="cap" id="zoomCap"></div></div></div>

<script id="vidbrief-data" type="application/json">/*__VIDBRIEF_DATA__*/null</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("vidbrief-data").textContent);
const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

// ── 主题(与时间线页同一套变量、同一个 localStorage 键) ──
{
  const saved = localStorage.getItem("vdb-theme");
  if (saved) document.documentElement.dataset.theme = saved;
  const btn = $("#themeBtn");
  const sync = () => { btn.textContent = document.documentElement.dataset.theme === "light" ? "☀️" : "🌙"; };
  sync();
  btn.onclick = () => {
    const next = document.documentElement.dataset.theme === "light" ? "" : "light";
    document.documentElement.dataset.theme = next;
    localStorage.setItem("vdb-theme", next);
    sync();
  };
}

function fmtT(s) {
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const mm = h ? String(m).padStart(2, "0") : String(m);
  return (h ? h + ":" : "") + mm + ":" + String(sec).padStart(2, "0");
}
const ORIGIN = { dense_region: "密集区", isolated_peak: "孤立峰", agent_request: "补截", manual: "人工" };
const CONF = { high: "有把握", medium: "一般", low: "没把握" };
const KIND = { homophone: "同音字", terminology: "术语", number: "数字", other: "其他" };
// checked_at 是 Rust 端格式化好的「年-月-日 时:分:秒 +08:00」,页面上只留到分
const shortAt = (s) => (s || "").replace(/^\d{4}-(\d{2}-\d{2}) (\d{2}:\d{2}).*$/, "$1 $2");

// ── 页头 ──
$("#pname").textContent = D.project.name;
{
  const bits = [`时长 ${fmtT(D.project.duration)}`];
  if (D.rounds !== null) bits.push(`校准 ${D.rounds} 轮`);
  bits.push(`渲染于 ${D.generated_at.replace(/:\d{2}\s.*$/, "")}`);
  $("#pmeta").textContent = bits.join(" · ");
  const link = $("#timelineLink");
  link.href = D.timeline_url;
  if (D.rounds === null) {
    const w = $("#warn");
    w.textContent = "状态文件不在或读不动:下面的结论栏来自明文投影(谁都能改),真相以 vidbrief status 为准。";
    w.classList.add("show");
  }
}

// ── 筛选器 ──
function makeFilters(mount, defs, apply) {
  let cur = defs[0].key;
  const buttons = defs.map((d) => {
    const b = el("button", "tool" + (d.key === cur ? " on" : ""), d.label);
    b.onclick = () => {
      cur = d.key;
      buttons.forEach((x) => x.classList.toggle("on", x === b));
      apply(cur);
    };
    mount.appendChild(b);
    return b;
  });
  apply(cur);
}

// ── 截图卡片 ──
const grid = $("#shotGrid");
const cards = [];
for (const s of D.shots) {
  const dropped = s.status === "drop";
  const low = !!(s.check && s.check.confidence === "low");
  const nomatch = !!(s.check && !s.check.match);
  const unchecked = !s.check && !dropped;

  const card = el("div", "shot" + (dropped ? " dropped" : "") + (low && !dropped ? " low" : "") + (nomatch && !dropped ? " nomatch" : ""));
  card.dataset.f = dropped ? "dropped" : unchecked ? "unchecked" : low ? "low" : "ok";

  const thumb = el("div", "thumb");
  const img = el("img");
  img.loading = "lazy";
  img.src = s.url;
  img.alt = s.id;
  thumb.appendChild(img);
  thumb.onclick = () => {
    $("#zoomImg").src = s.url;
    $("#zoomCap").textContent = `${s.id} · ${fmtT(s.t)}`;
    $("#zoom").classList.add("show");
  };
  card.appendChild(thumb);

  const body = el("div", "body");
  const head = el("div", "head");
  head.appendChild(el("span", "id", s.id));
  head.appendChild(el("span", "t", fmtT(s.t)));
  head.appendChild(el("span", "origin", ORIGIN[s.origin] || s.origin));
  if (dropped) head.appendChild(el("span", "badge dim", "已弃用"));
  if (unchecked) head.appendChild(el("span", "badge", "还没核验"));
  if (low) head.appendChild(el("span", "badge warn", "没把握"));
  if (nomatch) head.appendChild(el("span", "badge bad", "图文不符"));
  body.appendChild(head);

  if (dropped && s.reason) body.appendChild(el("div", "kv", `弃用理由:${s.reason}`));
  if (!dropped && s.reason) body.appendChild(el("div", "kv", `补图理由:${s.reason}`));

  if (s.check) {
    const c = s.check;
    const sync = el("div", "kv");
    sync.appendChild(el("span", "k", "音画同步:"));
    sync.appendChild(el("span", null, c.audio_visual_sync ? "对得上" : "对不上"));
    body.appendChild(sync);
    const read = el("div", "kv");
    read.appendChild(el("span", "k", "画面读出:"));
    read.appendChild(el("span", null, c.type_read));
    body.appendChild(read);
    if (c.issues.length) {
      const ul = el("ul", "issues");
      for (const i of c.issues) ul.appendChild(el("li", null, i));
      body.appendChild(ul);
    }
    if (c.evidence) {
      body.appendChild(el("div", "quote", `凭据(段 ${c.evidence.segment}):${c.evidence.quote}`));
    }
    const tail = el("div", "at", `${CONF[c.confidence] || c.confidence} · 写于 ${shortAt(c.checked_at)}`);
    body.appendChild(tail);
  }
  grid.appendChild(card);
  cards.push(card);
}
if (!D.shots.length) grid.appendChild(el("p", "hint", "还没有截图 —— 先跑 preprocess。"));
{
  const total = D.shots.length;
  const dropped = D.shots.filter((s) => s.status === "drop").length;
  const unchecked = D.shots.filter((s) => !s.check && s.status !== "drop").length;
  const low = D.shots.filter((s) => s.check && s.check.confidence === "low").length;
  $("#shotCounts").textContent =
    `共 ${total} 张 · 弃用 ${dropped} · 未核验 ${unchecked} · 没把握 ${low}`;
}
makeFilters($("#shotFilters"), [
  { key: "all", label: "全部" },
  { key: "unchecked", label: "还没核验" },
  { key: "low", label: "没把握" },
  { key: "dropped", label: "已弃用" },
], (cur) => {
  for (const c of cards) c.style.display = cur === "all" || c.dataset.f === cur ? "" : "none";
});

// ── 转录行 ──
const segList = $("#segList");
const rows = [];
for (const s of D.segments) {
  const row = el("div", "seg" + (s.state === "unchecked" ? " unchecked" : "") + (s.state === "needs_user" ? " needs_user" : ""));
  row.dataset.f = s.conclusion ? "touched" : s.state;

  const where = el("div", "where", `#${s.id} ${fmtT(s.start)}–${fmtT(s.end)}`);
  row.appendChild(where);

  const tags = el("div", "tags");
  if (s.conclusion) {
    const cls = s.state === "needs_user" ? "warn" : s.conclusion.label === "改了" ? "ok" : "dim";
    tags.appendChild(el("span", "badge " + cls, s.conclusion.label));
    if (s.conclusion.kind) tags.appendChild(el("span", "badge dim", KIND[s.conclusion.kind] || s.conclusion.kind));
  } else if (s.state === "unchecked") {
    tags.appendChild(el("span", "badge", "未核验"));
  } else {
    tags.appendChild(el("span", "badge ok", "核验过"));
  }
  row.appendChild(tags);

  const what = el("div", "what");
  if (s.conclusion && s.conclusion.label === "改了") {
    const old = el("span", "line old", s.text);
    const nw = el("span", "line new", s.effective);
    what.appendChild(old); what.appendChild(nw);
  } else {
    what.appendChild(el("span", "line", s.effective));
  }
  if (s.conclusion) {
    const why = el("div", "why", `${s.conclusion.note}${s.conclusion.reason ? " —— " + s.conclusion.reason : ""}`);
    what.appendChild(why);
  }
  if (s.checked_at) what.appendChild(el("span", "at", `写于 ${shortAt(s.checked_at)}`));
  row.appendChild(what);

  segList.appendChild(row);
  rows.push(row);
}
if (!D.segments.length) segList.appendChild(el("p", "hint", "还没有转录(源视频可能没有音轨,或还没跑 preprocess)。"));
{
  const total = D.segments.length;
  const changed = D.segments.filter((s) => s.conclusion && s.conclusion.label === "改了").length;
  const kept = D.segments.filter((s) => s.conclusion && s.conclusion.label === "决定不改").length;
  const uncertain = D.segments.filter((s) => s.state === "needs_user").length;
  const unchecked = D.segments.filter((s) => s.state === "unchecked").length;
  $("#segCounts").textContent =
    `共 ${total} 段 · 改过 ${changed} · 决定不改 ${kept} · 存疑 ${uncertain} · 未核验 ${unchecked}`;
}
makeFilters($("#segFilters"), [
  { key: "all", label: "全部" },
  { key: "touched", label: "有结论的" },
  { key: "needs_user", label: "存疑未改" },
  { key: "unchecked", label: "未核验" },
], (cur) => {
  for (const r of rows) {
    r.style.display = cur === "all"
      || (cur === "touched" && r.dataset.f === "touched")
      || (cur !== "all" && cur !== "touched" && r.dataset.f === cur) ? "" : "none";
  }
});

// ── 校准日志(原文内嵌,不解析) ──
$("#log").textContent = D.log || "还没有校准日志 —— 每轮校准结束时,用 write_note 记一轮(带 count_round)。";

// ── 放大层 ──
$("#zoom").onclick = () => $("#zoom").classList.remove("show");
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") $("#zoom").classList.remove("show");
});
</script>
</body>
</html>
