<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vidbrief 报告</title>
<!--
  纯图文报告页 —— **能单独保存、单独发给别人**(单文件分享时图会嵌进来)。
  视频、时间轴、浮层、抽屉那些功能性的东西都在**工作台**(`workbench.html`)那一页;
  这一页只做一件事:把这份报告读下来。
  CSS 四层:令牌 → 基座 → 组件 → 壳;底色只在令牌层决定。
  正文渲染与工作台**共用一份片段**(`ui/_shared.js`)—— 抄两份必然漂。
-->
<style>
/* ══ 1 令牌 ══ 只放变量。底色、前景、线、强调色都在这儿定死,别处只引用。 */
:root {
  color-scheme: dark;
  --bg:#14161a; --panel:#1c1f26; --panel2:#171a1f; --line:#2b3038; --fg:#d8dee9; --dim:#7b8494;
  --accent:#4aa3ff; --keep:#3fb950; --drop:#6e7681; --warn:#d29922; --bad:#f85149;
  --hover:#ffffff08; --ctl-bg:#232830; --ctl-bg-hover:#2e343d;
  --shadow:0 10px 34px #000a; --drawer-w:620px; --doc-w:860px;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg:#f6f7f9; --panel:#fff; --panel2:#fbfcfd; --line:#e3e6ea; --fg:#1f2328; --dim:#656d76;
  --accent:#0969da; --keep:#1a7f37; --drop:#8c959f; --warn:#9a6700; --bad:#cf222e;
  --hover:#0000000a; --ctl-bg:#eef0f3; --ctl-bg-hover:#e3e6ea;
  --shadow:0 10px 34px #00000026;
}

/* ══ 2 基座 ══ reset + 元素默认。**底色只在这里出现一次**。 */
* { box-sizing:border-box; }
html, body { height:100%; margin:0; overflow:hidden; }
body {
  background:var(--bg); color:var(--fg);
  font:13px/1.55 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
}
button { font:inherit; }
h2 { font-size:14px; margin:0 0 4px; }
h2 .counts { color:var(--dim); font-weight:400; font-size:12px; margin-left:8px; }
.hint { color:var(--dim); font-size:12px; margin:0 0 10px; }
/* 要留意的那两行(锚点过期 / 有洞的字)—— 空着时不占位,有话说时得看得见 */
.hint.warn { color:var(--warn); }
.empty { color:var(--dim); padding:4px 0; }
/* 滚动条:系统默认那根又粗又亮,贴在深色面板边上一眼就是「没管过」 */
@supports not selector(::-webkit-scrollbar) {
  * { scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
}
::-webkit-scrollbar { width:11px; height:11px; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background:transparent; }
::-webkit-scrollbar-thumb { background:color-mix(in srgb, var(--dim) 60%, transparent);
  border-radius:8px; border:3px solid transparent; background-clip:content-box; }
::-webkit-scrollbar-thumb:hover { background:var(--dim); background-clip:content-box; }

/* ══ 3 组件 ══ 只认自己的类名,与容器无关。 */
button.tool { font:inherit; font-size:12px; color:var(--fg); background:var(--ctl-bg);
  border:1px solid var(--line); border-radius:5px; padding:3px 9px; cursor:pointer; }
button.tool:hover { background:var(--ctl-bg-hover); }

/* ── 报告正文的 markdown ── */
.md p { margin:0 0 9px; }
.md h2, .md h3, .md h4 { font-size:14px; margin:12px 0 6px; }
.md ul { margin:0 0 9px; padding-left:20px; }
.md table { border-collapse:collapse; margin:0 0 10px; font-size:12.5px; }
.md th, .md td { border:1px solid var(--line); padding:3px 8px; text-align:left; vertical-align:top; }
.md blockquote { margin:0 0 9px; padding-left:10px; border-left:2px solid var(--line); color:var(--dim); }
.md code { background:var(--hover); padding:1px 4px; border-radius:4px; }
/* 长串(编号区间、链接、没有空格的长中文)不许把表格撑宽 —— 撑宽 = 内容被裁 */
.md td, .md th, .md code { overflow-wrap:anywhere; }

/* ── 知识点:抽屉 / 浮层 / 文档页三处共用 ── */
.topic-item { border-top:1px dashed var(--line); padding:12px 0 4px; }
.topic-item h4 { margin:0 0 4px; font-size:14px; }
.topic-item h4 .t { color:var(--accent); font-size:12px; margin-right:8px;
  font-variant-numeric:tabular-nums; }
.topic-item.now { background:var(--hover); border-radius:6px; }
.topic-item img { max-width:100%; border:1px solid var(--line); border-radius:6px;
  margin:8px 0; display:block; }
.sources { margin-top:9px; border-top:1px dashed var(--line); padding-top:6px;
  font-size:12px; color:var(--dim); }
.sources .k { color:var(--warn); }
.sources a { color:var(--accent); }
/* 待核验:读的人该回头核一下的点。**必须在页面上显眼** ——
   静默略过这种数字,结论就少一块而读者不知道。 */
.verify { margin-top:7px; border-top:1px dashed var(--warn); padding-top:5px;
  font-size:12px; color:var(--warn); }
.verify .k { font-weight:600; }
.verify ul { margin:3px 0 0; padding-left:18px; }
/* 转录段不是一个号码,是**一句话**:点一下视频跳到那一刻,悬停看原文。
   类名是 .segchip 而不是 .seg —— 转录列表已经占了 .seg(那是 grid 三列的一行)。 */
.segs { font-size:12px; color:var(--dim); margin-top:5px; line-height:2; }
.segchip { display:inline-block; margin:1px 5px 1px 0; padding:0 7px; font-size:11.5px;
  border:1px solid var(--line); border-radius:999px; color:var(--dim);
  text-decoration:none; cursor:pointer; white-space:nowrap; }
.segchip:hover { color:var(--fg); border-color:var(--accent); background:var(--hover); }
.segchip .t { color:var(--accent); margin-left:5px; }
.segchip:hover .t { text-decoration:underline; }
.segchip.missing { cursor:default; opacity:.6; }
.segchip.missing:hover { color:var(--dim); border-color:var(--line); background:none; }
.sources a, .segchip, .segs { overflow-wrap:anywhere; }
/* 点了能跳的,才摆出能点的样子 */
.jumpable { cursor:pointer; }
.doc .topic-item h4 .t, .doc .segchip { cursor:default; }
.doc .segchip:hover { color:var(--dim); border-color:var(--line); background:none; }
.doc .topic-item h4 .t { text-decoration:none; }

/* ── 图标按钮 ── */
.iconbtn { display:grid; place-items:center; width:32px; height:26px; border-radius:7px; font-size:13px;
  border:1px solid var(--line); background:none; color:var(--dim); cursor:pointer; }
.iconbtn:hover { background:var(--hover); color:var(--fg); }

/* ══ 4 壳 ══ 文档:单列、自己滚 —— 能单独保存、单独发给别人。 */
/* ── 4.2 文档壳(图文报告页:能单独保存 / 发出去)── */
/* 文档自己滚,不占根滚动那条路(那条路上底色的重算实测不靠谱)。 */
.doc { height:100%; overflow:auto; }
.doc .inner { max-width:var(--doc-w); margin:0 auto; padding:0 28px 96px; }
.doc-head { display:grid; grid-template-columns:1fr auto; align-items:center; padding:28px 0 0; }
.doc-head .name { grid-column:1; font-size:21px; font-weight:600; }
.doc-head .meta { grid-column:1; margin-top:5px; font-size:12.5px; color:var(--dim); }
.doc-head .back { grid-column:1; margin-top:7px; font-size:12.5px; color:var(--dim); text-decoration:none; }
.doc-head .back:hover { color:var(--accent); }
.doc-head .iconbtn { grid-column:2; grid-row:1 / span 2; }
.doc .report-title { font-size:17px; margin:30px 0 6px; }
.doc .md p { line-height:1.78; }                 /* 读的,不是扫的 */
.doc .topic-item h4 { font-size:15px; }
.toc { margin:28px 0 0; padding:12px 16px 14px; border:1px solid var(--line);
  border-radius:10px; background:var(--panel); }
.toc-h { font-weight:600; font-size:13px; margin-bottom:6px; }
.toc a { display:block; padding:2px 0; font-size:12.5px; color:var(--fg); text-decoration:none; }
.toc a:hover { color:var(--accent); }
.sep { margin:18px 0 4px; padding-top:12px; border-top:1px solid var(--line);
  font-weight:600; font-size:14px; }

/* ══ 5 打印 ══ 暗底打到白纸上就是一片黑,所以纸面上一律换成浅色。 */
@media print {
  :root { color-scheme: light;
    --bg:#fff; --panel:#fff; --panel2:#fff; --line:#cfd4da; --fg:#111; --dim:#555;
    --accent:#0645ad; --keep:#1a7f37; --warn:#8a5a00; --drop:#888; --hover:transparent; }
  .doc { height:auto; overflow:visible; }
  .doc .inner { max-width:none; padding:0; }
  .toc, .topic-item img { break-inside:avoid; }
}
</style>
</head>
<body>

<article class="doc">
  <div class="inner">
    <header class="doc-head">
      <div class="name" id="pname">…</div>
      <div class="meta" id="pmeta"></div>
      <!-- 与工作台那个「单独打开图文报告页 →」配成一对。路径是固定的:两页都在项目根下的固定位置。 -->
      <a class="back" href="../01_preprocess/workbench.html">在工作台里看(播放器 + 共轴)→</a>
      <button class="iconbtn" id="theme" title="切换亮色/暗色">🌙</button>
    </header>
    <h2 class="report-title">报告<span class="counts" id="repCounts"></span></h2>
    <p class="hint" id="notices"></p>
    <div class="md" id="repSummary"></div>
    <nav class="toc" id="toc" hidden></nav>
    <div class="sep">知识点</div>
    <div id="repList"></div>
  </div>
</article>

<script id="vidbrief-data" type="application/json">/*__VIDBRIEF_DATA__*/null</script>
<script>
"use strict";
/*__SHARED_JS__*/

const D = JSON.parse(document.getElementById("vidbrief-data").textContent);
const shotById = new Map((D.shots || []).map((s) => [s.id, s]));
const segById = new Map((D.segments || []).map((s) => [s.id, s]));
const REPORT = D.report || { summary: "", topics: [] };
const TOPICS = (REPORT.topics || []).slice().sort((a, b) => a.t - b.t);

// ── 主题:与工作台共用一份偏好(localStorage 同一个键)──
const THEME_KEY = "vidbrief-theme";
function applyTheme(v) {
  if (v) document.documentElement.dataset.theme = v;
  document.getElementById("theme").textContent =
    document.documentElement.dataset.theme === "light" ? "🌙" : "☀️";
}
let savedTheme = null;
try { savedTheme = localStorage.getItem(THEME_KEY); } catch (e) { /* file:// 下可能不给读 */ }
applyTheme(savedTheme);
document.getElementById("theme").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* 存不下就算了 */ }
});

// ── 渲染 ──
document.title = (D.project.name || D.project.id) + " · 报告";
document.getElementById("pname").textContent = D.project.name || D.project.id;
document.getElementById("pmeta").textContent =
  (D.project.id || "") + (REPORT.generated_at ? " · 生成于 " + shortAt(REPORT.generated_at) : "");
document.getElementById("repCounts").textContent =
  TOPICS.length + " 条" + (D.style_text ? " · " + D.style_text : "");
document.getElementById("repSummary").innerHTML =
  md(REPORT.summary) || "<p class='empty'>（还没有全局总结）</p>";
document.getElementById("repList").appendChild(topicNodes(TOPICS));

// 页眉下面那一行提示:单文件版 / 锚点过期 / 有洞的字。**只报不拦** ——
// 报告照看,但读者得知道"这一句是听来的、可它已经不在材料里了"。
const notices = [];
if (D.self_contained) notices.push("这一份是单文件版:图已经嵌进文件里,视频那一半带不走。");
if ((D.stale || []).length) notices.push("锚点过期:" + D.stale.join(";"));
if ((D.damaged || []).length) notices.push("这页有洞的字:" + D.damaged.join(";"));
document.getElementById("notices").textContent = notices.join(" ");
document.getElementById("notices").classList.toggle("warn", notices.length > 0);

// 目录:条数太少不值当
if (TOPICS.length > 3) {
  const toc = document.getElementById("toc");
  toc.hidden = false;
  toc.appendChild(el("div", "toc-h", "目录"));
  TOPICS.forEach((t, i) => {
    const a = el("a", null, (i + 1) + ". " + t.title);
    a.href = "#ti-" + i;
    toc.appendChild(a);
  });
}
</script>
</body>
</html>
