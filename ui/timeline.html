<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vidbrief 时间线</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --line: #2b3038; --fg: #d8dee9; --dim: #7b8494;
    --accent: #4aa3ff; --keep: #3fb950; --drop: #6e7681; --track-h: 62px; --sub-h: 30px;
    --hover: #ffffff08; --seg: #4aa3ff33; --seg-fixed: #3fb95055;
    --ctl-bg: #232830; --ctl-bg-hover: #2e343d;
    /* 提示气泡的底色/阴影:暗色下比页面更深(像浮在上面),亮色下是近白 */
    --tip-bg: #0b0d10f2; --tip-shadow: 0 6px 22px #0009;
    /* 警告色当**文字**用时两套主题要分开:同一个橙色在白底上对比度只有 2.4:1,看不清。
       但当**色块**用时(图例小方块)必须保持同一个值 —— 它要和画布上的区域底色对得上。 */
    --warn: #d29922;
  }
  /* 亮色模式。**视频区不跟着变** —— 见下面 .video-wrap 的说明。 */
  :root[data-theme="light"] {
    --bg: #f6f7f9; --panel: #ffffff; --line: #e3e6ea; --fg: #1f2328; --dim: #656d76;
    --accent: #0969da; --keep: #1a7f37; --drop: #8c959f;
    --hover: #0000000a; --seg: #0969da29; --seg-fixed: #1a7f3729;
    --ctl-bg: #eef0f3; --ctl-bg-hover: #e3e6ea;
    --tip-bg: #fffffff7; --tip-shadow: 0 6px 22px #00000024;
    --warn: #9a6700;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.55 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .meta { color: var(--dim); font-size: 12px; }
  header .spacer { flex: 1; }
  header .warn { color: var(--warn); font-size: 12px; }
  header .tool { display: flex; align-items: center; gap: 8px; }
  main { padding: 16px 18px 60px; max-width: 1600px; margin: 0 auto; }

  button.tool, select.tool {
    font: inherit; font-size: 12px; color: var(--fg); background: var(--ctl-bg);
    border: 1px solid var(--line); border-radius: 5px; padding: 3px 9px; cursor: pointer;
  }
  button.tool:hover, select.tool:hover { background: var(--ctl-bg-hover); }

  /* ── 视频 + 覆盖层 ──────────────────────────────────────── */
  /* 视频区**永远是黑底**:它是画面本身,不是页面的一部分 —— 亮色模式下给视频加白底
     只会变成一圈刺眼的白框。所以这里用固定的 #000,不跟主题。 */
  .video-wrap { position: relative; background: #000; border: 1px solid var(--line);
    border-radius: 6px; overflow: hidden; }
  video { display: block; width: 100%; max-height: 56vh; background: #000; }

  /* 覆盖层画在**视频上面**,而视频多数是深色画面 —— 所以这一整块刻意**不跟随主题**:
     黑底 + 白字在任何主题下都看得清;跟着主题走的话,亮色模式下就成了白字白底。
     (原来那个加载转圈之所以看不清,根子就在这里:它是浏览器自己画的深色动画,
     压在深色画面上。我们自己画一个高对比度的盖住它。) */
  .v-overlay { position: absolute; inset: 0; display: grid; place-items: center;
    pointer-events: none; }
  #bigPlay {
    display: none; width: 78px; height: 78px; border-radius: 50%;
    border: 2px solid #ffffffb0; background: #000000a8; color: #fff;
    font-size: 30px; line-height: 1; cursor: pointer; padding: 0 0 0 6px;
    transition: background .12s, transform .12s; pointer-events: auto;
  }
  #bigPlay:hover { background: #000000d9; transform: scale(1.06); }
  .video-wrap.paused #bigPlay { display: block; }
  /* 暂停时把画面压暗一点,让播放键更突出 */
  .video-wrap.paused video { filter: brightness(.82); }

  #vStatus { position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center;
    /* 遮罩要够厚:浏览器自己的加载转圈画在**我们上面**(它在 video 的 shadow DOM 里,
       层级压不住),只能靠加厚遮罩把它盖住。断线时直接盖到接近不透明。 */
    background: #000000c4; color: #fff; padding: 24px; }
  #vStatus.show { display: flex; }
  #vStatus.broken { background: #000000f5; }
  #vStatus .spinner {
    width: 46px; height: 46px; border-radius: 50%;
    border: 3px solid #ffffff3d; border-top-color: #fff;
    animation: vspin .85s linear infinite;
  }
  @keyframes vspin { to { transform: rotate(360deg); } }
  #vStatus .msg { font-size: 13px; }
  #vStatus .hint { font-size: 12px; color: #ffffffb8; max-width: 560px; line-height: 1.75; }
  #vStatus code { background: #ffffff24; padding: 1px 6px; border-radius: 3px;
    font-family: ui-monospace, Consolas, monospace; }
  #vStatus .icon { font-size: 34px; line-height: 1; display: none; }
  #vStatus.broken .spinner { display: none; }
  #vStatus.broken .icon { display: block; }
  #vRetry { display: none; pointer-events: auto; font: inherit; font-size: 12px;
    padding: 6px 18px; border-radius: 5px; cursor: pointer;
    border: 1px solid #ffffff7a; background: #ffffff1f; color: #fff; }
  #vRetry:hover { background: #ffffff33; }
  #vStatus.broken #vRetry { display: inline-block; }

  .vbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 8px 2px 0; color: var(--dim); font-size: 12px; }
  .vbar .kbd { color: var(--fg); }
  .vbar .spacer { flex: 1; }

  /* 五层共轴:每一层的 left 都是 (t / duration) * 100% */
  .stack { position: relative; margin-top: 14px; user-select: none; }
  .layer { position: relative; border-bottom: 1px solid var(--line); }
  .layer:last-child { border-bottom: 0; }
  .layer-label { position: absolute; left: 0; top: 0; z-index: 4; font-size: 11px;
    color: var(--dim); background: var(--bg); padding: 1px 6px 1px 0; pointer-events: none; }
  #histWrap { height: 110px; background: var(--panel); cursor: crosshair; }
  #hist { display: block; width: 100%; height: 110px; }
  #regions { position: absolute; inset: 0; pointer-events: none; }

  #ruler { height: 22px; background: var(--panel); cursor: crosshair; }
  .tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); }
  .tick span { position: absolute; left: 3px; top: 3px; font-size: 10px; color: var(--dim); }

  #shots { height: var(--track-h); background: var(--panel); }
  .shot { position: absolute; top: 5px; height: calc(var(--track-h) - 12px);
    border: 2px solid var(--keep); border-radius: 3px; overflow: hidden; cursor: pointer;
    background: #000; transform: translateX(-50%); transition: box-shadow .12s; }
  .shot img { display: block; height: 100%; width: auto; }
  .shot:hover { box-shadow: 0 0 0 2px var(--accent); z-index: 5; }
  .shot.drop { border-color: var(--drop); opacity: .45; }
  .shot.unchecked { border-style: dashed; }
  .shot .tag { position: absolute; left: 0; bottom: 0; font-size: 9px; padding: 0 3px;
    /* 这个角标压在**缩略图**上(深色画面),所以底色深、字色固定白 —— 不跟主题走 */
    background: #000a; color: #fff; }

  #subs { height: var(--sub-h); background: var(--panel); cursor: crosshair; overflow: hidden; }
  .seg { position: absolute; top: 4px; bottom: 4px; min-width: 1px;
    background: var(--seg); border-radius: 2px; cursor: pointer; }
  .seg:hover { background: var(--accent); }
  .seg.fixed { background: var(--seg-fixed); }

  #playhead { position: absolute; top: 0; bottom: 0; width: 1px; background: #ff5c5c;
    pointer-events: none; z-index: 6; }
  #playhead::before { content: ""; position: absolute; top: -4px; left: -4px;
    border: 5px solid transparent; border-top-color: #ff5c5c; }

  #tip { position: fixed; z-index: 50; max-width: 420px; display: none;
    /* 跟着主题走:气泡浮在**页面**上(不是压在视频上),所以页面是亮色时它也该是亮色。
       早先这里写死了深色底,而字色是 var(--fg) —— 亮色模式下就成了深字压深底。 */
    background: var(--tip-bg); border: 1px solid var(--line); border-radius: 5px;
    color: var(--fg);
    padding: 7px 9px; font-size: 12px; line-height: 1.5; pointer-events: none;
    box-shadow: var(--tip-shadow); }
  #tip .t { color: var(--accent); font-variant-numeric: tabular-nums; }
  #tip .k { color: var(--dim); }

  /* 两列**同高**,滚动区用 flex:1 填满卡片。
     这里的关键是:高度要定在**整个区域**上(`.below`),不是定在列表上。
     - 早先定在列表上(`#subList { max-height: 46vh }`)→ 卡片被 grid 拉得更高,
       列表不跟着长 → 底部留一块空白(看起来像渲染坏了);
     - 定在 `.below` 上 → grid 行高就是确定的,内容再多也撑不大它,
       里面的 `.fill` 自然吃满剩余空间。
     `.fill` 用 `flex: 1 1 0`(basis 0)而不是 `auto`:basis auto 会让内容的
     max-content 高度参与父级尺寸计算,322 行字幕能把整页撑到一万像素。 */
  .below { display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 16px;
    margin-top: 16px; height: 60vh; min-height: 300px; }
  .col { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  /* 列里的**最后一张卡**吃满剩余高度(那总是"截图"卡)。
     不给它 flex 的话,列是定高了,但卡片还是自然高度 —— 底部照样空一块。
     第一张(当前字幕)保持自然高度:它是几行字,不该被拉长。 */
  .col > .card:last-child { flex: 1 1 0; }
  .card { display: flex; flex-direction: column; min-height: 0;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  .card > h2 { flex: 0 0 auto; font-size: 12px; margin: 0; padding: 8px 12px;
    border-bottom: 1px solid var(--line); color: var(--dim); font-weight: 600; }
  /* 滚动区:吃满卡片剩下的高度 */
  .fill { flex: 1 1 0; min-height: 0; overflow: auto; }
  .card .body { padding: 10px 12px; flex: 0 0 auto; }
  #now { white-space: pre-wrap; min-height: 3em; }
  #now .ts { color: var(--accent); font-variant-numeric: tabular-nums; margin-right: 8px; }
  @media (max-width: 1100px) {
    .below { grid-template-columns: minmax(0, 1fr); height: auto; }
    /* 窄屏堆成一列时,再固定 60vh 就太高了 —— 让每块按内容长,各自封顶。
       这里必须把 flex-basis 从 0 换回 auto:卡片高度是 auto 时,basis 0 会让
       列表的"假设尺寸"变成 0,直接塌掉。 */
    .fill { flex: 1 1 auto; max-height: 40vh; }
  }

  .row { display: flex; gap: 10px; padding: 6px 12px; border-bottom: 1px solid var(--line);
    cursor: pointer; align-items: flex-start; }
  .row:hover { background: var(--hover); }
  #shotsPanel .row img { width: 84px; border-radius: 3px; border: 1px solid var(--line); }
  #shotsPanel .row .txt { flex: 1; min-width: 0; }
  #shotsPanel .row .h { font-variant-numeric: tabular-nums; color: var(--accent); }
  #shotsPanel .row .m { color: var(--dim); font-size: 11px; word-break: break-word; }
  /* 注意:**不要**在这里再给 #subList 加 max-height。它现在靠 .fill 的 flex:1
     吃满卡片;固定高度会让它在卡片里留出空白(这正是当初那块空白的成因)。 */
  #subList .row.cur { background: var(--seg); }
  #subList .row .ts { color: var(--dim); font-variant-numeric: tabular-nums; flex: 0 0 78px; }
  #subList .row .tx { flex: 1; }
  #subList .row .fix { color: var(--warn); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--dim); font-size: 11px; margin-top: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px;
    vertical-align: -1px; margin-right: 4px; }
</style>
</head>
<body>

<header>
  <h1 id="pname">…</h1>
  <span class="meta" id="pmeta"></span>
  <span class="spacer"></span>
  <span class="warn" id="warn"></span>
  <span class="tool">
    <button class="tool" id="themeBtn" title="切换亮色/暗色">🌙</button>
  </span>
</header>

<main>
  <div class="video-wrap paused" id="videoWrap">
    <video id="v" controls preload="metadata" playsinline></video>
    <div class="v-overlay">
      <button id="bigPlay" title="播放(空格)">▶</button>
      <div id="vStatus">
        <div class="spinner"></div>
        <div class="icon">⚠</div>
        <div class="msg" id="vMsg">缓冲中…</div>
        <div class="hint" id="vHint"></div>
        <button id="vRetry">重试</button>
      </div>
    </div>
  </div>

  <div class="vbar">
    <span><span class="kbd">空格</span> 播放/暂停 · <span class="kbd">← →</span> ±1s(Shift ±10s)
      · <span class="kbd">[ ]</span> 调速 · <span class="kbd">t</span> 换主题 · 点/拖时间轴跳转</span>
  </div>

  <div class="stack" id="stack">
    <div class="layer" id="histWrap">
      <span class="layer-label">① 差帧图(每秒变化率)</span>
      <canvas id="hist"></canvas>
      <div id="regions"></div>
    </div>
    <div class="layer" id="ruler"><span class="layer-label">② 时间轴</span></div>
    <div class="layer" id="shots"><span class="layer-label">③ 预筛选截图</span></div>
    <div class="layer" id="subs"><span class="layer-label">④ 语音转文字</span></div>
    <div id="playhead"></div>
  </div>

  <div class="legend">
    <span><i style="background:var(--accent)"></i>变化率</span>
    <span><i style="background:#d29922"></i>密集区</span>
    <span><i style="background:#db61a2"></i>孤立切换</span>
    <span><i style="background:var(--keep)"></i>长静止后的章节起点</span>
    <span>虚线边框 = 截图未校准</span>
  </div>

  <div class="below">
    <div class="col">
      <div class="card"><h2>当前字幕</h2><div class="body" id="now">—</div></div>
      <div class="card">
        <h2>截图(<span id="shotCount">0</span>)</h2>
        <div class="fill" id="shotsPanel"></div>
      </div>
    </div>
    <div class="card">
      <h2>全部字幕(<span id="segCount">0</span>)</h2>
      <div class="fill" id="subList"></div>
    </div>
  </div>
</main>

<div id="tip"></div>

<script id="vidbrief-data" type="application/json">/*__VIDBRIEF_DATA__*/null</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("vidbrief-data").textContent);
const $ = (s) => document.querySelector(s);
const v = $("#v"), stack = $("#stack"), tip = $("#tip");
const duration = D.project.duration || 1;

v.src = D.video_url;

/* ── 主题(亮/暗)────────────────────────────────────────────
   跟着系统走,手动切过就记住。画布上的颜色也要跟着重画 ——
   它们是在 JS 里画的,不会自己跟着 CSS 变量变。 */
const themeBtn = $("#themeBtn");
function applyTheme(name) {
  document.documentElement.dataset.theme = name;
  themeBtn.textContent = name === "light" ? "☀" : "🌙";
  themeBtn.title = name === "light" ? "切换到暗色" : "切换到亮色";
  drawHist(); // 画布颜色取自 CSS 变量,换主题必须重画
}
{
  const saved = localStorage.getItem("vidbrief-theme");
  const preferLight = window.matchMedia("(prefers-color-scheme: light)").matches;
  // **不在这里立刻 applyTheme()** —— 它会调 drawHist(),而离屏 canvas(`off`)
  // 是文件后面才声明的 const,提前访问会踩 TDZ。真正的初始化放在文件末尾。
  window.__vidbriefTheme = saved || (preferLight ? "light" : "dark");
}
themeBtn.addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  localStorage.setItem("vidbrief-theme", next);
  applyTheme(next);
});

/** 读一个 CSS 变量的当前值(画布上要用)。 */
function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

/* ── 播放/暂停覆盖层 + 缓冲/断线提示 ─────────────────────── */
const wrap = $("#videoWrap");
const vStatus = $("#vStatus");
const vMsg = $("#vMsg");
const vHint = $("#vHint");

function setPausedUi(paused) { wrap.classList.toggle("paused", paused); }
v.addEventListener("play", () => setPausedUi(false));
v.addEventListener("pause", () => setPausedUi(true));
v.addEventListener("ended", () => setPausedUi(true));
$("#bigPlay").addEventListener("click", (ev) => { ev.stopPropagation(); v.play(); });

/** 显示"缓冲中"。这一层压在视频上,所以用固定的黑底白字,不跟主题。 */
function showBuffering() {
  vStatus.classList.remove("broken");
  vMsg.textContent = "缓冲中…";
  vHint.innerHTML = "";
  vStatus.classList.add("show");
}

/**
 * 显示"服务已断开"。
 *
 * **这一条比转圈重要得多**:浏览器自己的加载动画会一直转下去,看起来跟"卡了一下"
 * 没区别,用户只会干等。我们主动探测一下服务还在不在,不在就把重跑命令摆出来。
 */
function showBroken(detail) {
  vStatus.classList.add("show", "broken");
  vMsg.textContent = "本地查看服务已断开";
  vHint.innerHTML =
    "视频和图片都取不到了 —— 那个 <code>vidbrief ui</code> 进程已经不在了。<br>" +
    "重新跑一次即可(页面本身还在,不用重开):<br>" +
    "<code>vidbrief ui &lt;项目&gt;</code>" +
    (detail ? "<br><span style='opacity:.7'>" + esc(detail) + "</span>" : "");
}
function hideStatus() { vStatus.classList.remove("show", "broken"); }

let probeTimer = null;

/**
 * 一边显示状态一边探服务是否还在。
 *
 * **为什么用轮询而不是一次性定时器**:一次性定时器会被 `seeked`/`canplay`
 * 之类的事件清掉,而事件顺序不保证 —— 清掉之后就再也不会探测了,又回到"永远转圈"。
 * 轮询只关心"状态层还开着吗",状态一关就自己停,不会漏也不会重复。
 */
function startProbing() {
  if (probeTimer) return;
  probeTimer = setInterval(probeOnce, 1500);
  probeOnce(); // 立刻先探一次 —— 服务真死了应当马上说,不必等一个周期
}

function stopProbing() {
  if (probeTimer) { clearInterval(probeTimer); probeTimer = null; }
}

async function probeOnce() {
  if (!vStatus.classList.contains("show")) { stopProbing(); return; }
  if (!v.paused && v.readyState >= 3 && !v.seeking) { stopProbing(); return; }
  try {
    const r = await fetch(D.probe_url, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    // 服务还在,那就是单纯慢 —— 继续显示"缓冲中"
  } catch (e) {
    stopProbing();
    showBroken(String(e && e.message ? e.message : e));
  }
}

v.addEventListener("waiting", () => { showBuffering(); startProbing(); });
v.addEventListener("stalled", () => { showBuffering(); startProbing(); });
v.addEventListener("playing", () => { stopProbing(); hideStatus(); });
v.addEventListener("canplay", () => { stopProbing(); hideStatus(); });
v.addEventListener("seeked", () => { if (v.readyState >= 3) { stopProbing(); hideStatus(); } });
v.addEventListener("error", () => {
  const code = v.error ? "MediaError " + v.error.code : "未知错误";
  showBroken(code + " —— 多半是服务已经不在了");
});
$("#vRetry").addEventListener("click", () => {
  hideStatus();
  v.load();          // 重新拉一遍元数据与数据
  syncTo(v.currentTime || 0);
});

/* ── 倍速 ──────────────────────────────────────────────────
   **界面里刻意不放倍速控件** —— 浏览器自带的播放器菜单("⋮" → 播放速度)已经有了,
   再加一个就是重复的 UI。这里只留 `[` `]` 快捷键:它是隐形的,不占地方,
   而且能调到浏览器菜单里没有的 2.5× / 3×(看长教程时有用)。 */
const RATES = [0.5, 0.75, 1, 1.25, 1.5, 2, 2.5, 3];

/** 按 `step` 调到**方向上的下一档**。
 *
 * 不在预设里的速度(比如浏览器菜单设的 1.75×)直接按方向找下一个,而不是
 * "先吸附到最近预设再挪一格" —— 后者会在 1.75× 按 `[` 时跳到 1.25×,
 * 把 1.5× 整个跳过去,不是用户想要的"慢一点"。
 * 到头了(已经在最慢/最快)就什么都不做,不反向弹回去。 */
function nudgeRate(step) {
  const cur = v.playbackRate;
  const next = step > 0
    ? RATES.find((r) => r > cur + 1e-3)
    : [...RATES].reverse().find((r) => r < cur - 1e-3);
  if (next !== undefined) v.playbackRate = next;
}

$("#pname").textContent = D.project.name || D.project.id;
$("#pmeta").textContent =
  D.project.id + " · " + fmtTime(duration) + " · " + D.curve.scores.length + " 个采样点 / " +
  D.regions.length + " 个变化区 / " + D.shots.length + " 张截图 / " + D.segments.length + " 段字幕";
if (!D.segments.length) $("#warn").textContent = "还没有转录(源视频可能没有音轨)";

function fmtTime(t) {
  t = Math.max(0, t || 0);
  const m = Math.floor(t / 60), s = t - m * 60;
  return String(m).padStart(2, "0") + ":" + s.toFixed(1).padStart(4, "0");
}

/* ── 差帧图:画一次到离屏 canvas,之后只叠播放头 ─────────── */
const histWrap = $("#histWrap"), hist = $("#hist"), hctx = hist.getContext("2d");
const off = document.createElement("canvas");
let W = 0, H = 0;

function drawHist() {
  const dpr = window.devicePixelRatio || 1;
  W = histWrap.clientWidth; H = histWrap.clientHeight;
  for (const c of [hist, off]) { c.width = W * dpr; c.height = H * dpr; }
  hist.style.width = W + "px"; hist.style.height = H + "px";
  const c = off.getContext("2d");
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);

  const n = D.curve.scores.length;
  if (!n) return;
  const bw = W / n;
  const maxS = Math.max(D.curve.max_score, 1e-6);

  // 区域底色 + 边界
  const rg = $("#regions");
  rg.innerHTML = "";
  for (const r of D.regions) {
    const x0 = (r.start / duration) * W;
    const x1 = ((r.end + D.curve.step) / duration) * W;
    const kind = r.reason === "high_density" ? "#d29922" : (r.reason === "isolated_peak" ? "#db61a2" : "#3fb950");
    c.fillStyle = kind + "22";
    c.fillRect(x0, 0, Math.max(1, x1 - x0), H);
    c.fillStyle = kind + "88";
    c.fillRect(x0, 0, 1, H);
    c.fillRect(Math.max(0, x1 - 1), 0, 1, H);
  }

  // 变化率柱
  for (let i = 0; i < n; i++) {
    const s = Math.min(1, D.curve.scores[i] / maxS);
    const h = s * (H - 14);
    c.fillStyle = "hsl(" + (205 - 205 * s) + " 85% " + (28 + 34 * s) + "%)";
    c.fillRect(i * bw, H - h, Math.max(bw * 0.85, 0.6), h);
  }
  c.fillStyle = cssVar("--line") || "#2b3038";
  c.fillRect(0, H - 1, W, 1);
  paint();
}

function paint() {
  const dpr = window.devicePixelRatio || 1;
  hctx.setTransform(1, 0, 0, 1, 0, 0);
  hctx.clearRect(0, 0, hist.width, hist.height);
  hctx.drawImage(off, 0, 0);
  hctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* ── 刻度 ────────────────────────────────────────────────── */
function drawRuler() {
  const ruler = $("#ruler");
  ruler.querySelectorAll(".tick").forEach((e) => e.remove());
  const W = ruler.clientWidth;
  const step = [5, 10, 15, 30, 60, 120, 300, 600].find((s) => (s / duration) * W >= 70) || 600;
  for (let t = 0; t <= duration; t += step) {
    const el = document.createElement("div");
    el.className = "tick";
    el.style.left = (t / duration) * 100 + "%";
    el.innerHTML = "<span>" + fmtTime(t) + "</span>";
    ruler.appendChild(el);
  }
}

/* ── 截图轨 + 截图面板 ───────────────────────────────────── */
function drawShots() {
  const track = $("#shots");
  track.querySelectorAll(".shot").forEach((e) => e.remove());
  const panel = $("#shotsPanel");
  panel.innerHTML = "";
  $("#shotCount").textContent = D.shots.length;

  for (const s of D.shots) {
    const el = document.createElement("div");
    el.className = "shot" + (s.status === "drop" ? " drop" : "") + (s.check ? "" : " unchecked");
    el.style.left = (s.t / duration) * 100 + "%";
    el.innerHTML = '<img loading="lazy" src="' + s.url + '" alt="' + s.id + '"><span class="tag">' + s.id + "</span>";
    el.addEventListener("click", (ev) => { ev.stopPropagation(); seek(s.t); });
    el.addEventListener("mousemove", (ev) => showTip(ev, shotTip(s)));
    el.addEventListener("mouseleave", hideTip);
    track.appendChild(el);

    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = '<img loading="lazy" src="' + s.url + '" alt="' + s.id + '">' +
      '<div class="txt"><div class="h">' + s.id + " · " + fmtTime(s.t) + " · " + s.origin + "</div>" +
      '<div class="m">' + (s.check ? esc(s.check.type_read) : "<em>未校准</em>") +
      (s.check && s.check.issues.length ? "<br>⚠ " + esc(s.check.issues.join(" / ")) : "") +
      "</div></div>";
    row.addEventListener("click", () => seek(s.t));
    panel.appendChild(row);
  }
}

function shotTip(s) {
  const c = s.check;
  return "<div><span class='t'>" + s.id + "</span> <span class='k'>t=" + s.t.toFixed(2) + "s · " +
    s.origin + (s.region_id != null ? " · 区域 #" + s.region_id : "") + "</span></div>" +
    (s.reason ? "<div class='k'>补图理由:" + esc(s.reason) + "</div>" : "") +
    (c
      ? "<div>" + esc(c.type_read) + "</div><div class='k'>match=" + c.match +
        " sync=" + c.audio_visual_sync + " 置信=" + c.confidence + "</div>" +
        (c.issues.length ? "<div>⚠ " + esc(c.issues.join(" / ")) + "</div>" : "")
      : "<div class='k'>尚未校准</div>");
}

/* ── 字幕轨 + 字幕面板 ───────────────────────────────────── */
const subRows = [];
function drawSubs() {
  const track = $("#subs");
  track.querySelectorAll(".seg").forEach((e) => e.remove());
  const list = $("#subList");
  list.innerHTML = "";
  subRows.length = 0;
  $("#segCount").textContent = D.segments.length;

  D.segments.forEach((sg, i) => {
    const el = document.createElement("div");
    el.className = "seg" + (sg.corrected ? " fixed" : "");
    el.style.left = (sg.start / duration) * 100 + "%";
    el.style.width = Math.max(((sg.end - sg.start) / duration) * 100, 0.15) + "%";
    el.addEventListener("mousemove", (ev) => showTip(ev,
      "<div class='t'>" + fmtTime(sg.start) + " – " + fmtTime(sg.end) + "</div><div>" + esc(sg.text) + "</div>" +
      (sg.correction ? "<div class='k'>纠错:" + esc(sg.correction.note) + " — " + esc(sg.correction.reason) + "</div>" : "")));
    el.addEventListener("mouseleave", hideTip);
    el.addEventListener("click", (ev) => { ev.stopPropagation(); seek(sg.start + 0.01); });
    track.appendChild(el);

    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = "<span class='ts'>" + fmtTime(sg.start) + "</span><span class='tx'>" + esc(sg.text) +
      (sg.correction ? "<span class='fix'> ✎ " + esc(sg.correction.note) + "</span>" : "") + "</span>";
    row.addEventListener("click", () => seek(sg.start + 0.01));
    list.appendChild(row);
    subRows.push(row);
  });
}

/* ── 播放头 + 当前字幕 ───────────────────────────────────── */
const playhead = $("#playhead");
let curSeg = -1;

function syncTo(t) {
  playhead.style.left = Math.min(100, Math.max(0, (t / duration) * 100)) + "%";

  let idx = -1;
  for (let i = 0; i < D.segments.length; i++) {
    if (t >= D.segments[i].start && t <= D.segments[i].end) { idx = i; break; }
  }
  if (idx === curSeg) return;
  if (subRows[curSeg]) subRows[curSeg].classList.remove("cur");
  curSeg = idx;
  const now = $("#now");
  if (idx < 0) { now.textContent = "—"; return; }

  const sg = D.segments[idx];
  now.innerHTML = "<span class='ts'>" + fmtTime(sg.start) + "</span>" + esc(sg.text) +
    (sg.correction ? "\n✎ " + esc(sg.correction.note) + "(" + esc(sg.correction.reason) + ")" : "");

  const r = subRows[idx];
  if (r) {
    r.classList.add("cur");
    const box = $("#subList");
    if (r.offsetTop < box.scrollTop || r.offsetTop > box.scrollTop + box.clientHeight - 30) {
      box.scrollTop = r.offsetTop - box.clientHeight / 2;
    }
  }
}

v.addEventListener("timeupdate", () => syncTo(v.currentTime));
v.addEventListener("seeked", () => syncTo(v.currentTime));

/* ── 跳转 / 拖动 ─────────────────────────────────────────── */
function seek(t) {
  const upper = Math.max(0, (v.duration || duration) - 0.05);
  v.currentTime = Math.min(Math.max(t, 0), upper);
  syncTo(v.currentTime);
}

function timeAt(clientX) {
  const r = stack.getBoundingClientRect();
  const ratio = (clientX - r.left) / r.width;
  return Math.min(Math.max(ratio, 0), 1) * duration;
}

let dragging = false;
stack.addEventListener("mousedown", (ev) => {
  if (ev.target.closest(".shot") || ev.target.closest(".seg")) return;
  dragging = true;
  seek(timeAt(ev.clientX));
  ev.preventDefault();
});
window.addEventListener("mousemove", (ev) => { if (dragging) seek(timeAt(ev.clientX)); });
window.addEventListener("mouseup", () => { dragging = false; });

const ruler = $("#ruler");
histWrap.addEventListener("mousemove", (ev) => {
  const t = timeAt(ev.clientX);
  const s = D.curve.scores[Math.round(t / D.curve.step)];
  showTip(ev, "<div class='t'>" + fmtTime(t) + "</div>" +
    (s == null ? "" : "<div>变化率 <b>" + s.toFixed(3) + "</b></div>") + regionAt(t));
});
histWrap.addEventListener("mouseleave", hideTip);
ruler.addEventListener("mousemove", (ev) => showTip(ev, "<div class='t'>" + fmtTime(timeAt(ev.clientX)) + "</div>"));
ruler.addEventListener("mouseleave", hideTip);

function regionAt(t) {
  const r = D.regions.find((x) => t >= x.start && t <= x.end);
  return r ? "<div class='k'>区域 #" + r.id + " · " + r.reason + " · 峰值 " + r.peak_score.toFixed(3) +
    " @ " + fmtTime(r.peak_t) + "</div>" : "";
}

/* ── 气泡 ────────────────────────────────────────────────── */
function showTip(ev, html) {
  tip.innerHTML = html;
  tip.style.display = "block";
  const pad = 14;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  const r = tip.getBoundingClientRect();
  if (x + r.width > window.innerWidth - 8) x = ev.clientX - r.width - pad;
  if (y + r.height > window.innerHeight - 8) y = ev.clientY - r.height - pad;
  tip.style.left = x + "px";
  tip.style.top = y + "px";
}
function hideTip() { tip.style.display = "none"; }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/* ── 键盘 ────────────────────────────────────────────────── */
window.addEventListener("keydown", (ev) => {
  if (ev.target.tagName === "INPUT" || ev.target.tagName === "SELECT" || ev.target.tagName === "TEXTAREA") return;
  if (ev.code === "Space") { v.paused ? v.play() : v.pause(); ev.preventDefault(); }
  if (ev.code === "ArrowLeft") { seek(v.currentTime - (ev.shiftKey ? 10 : 1)); ev.preventDefault(); }
  if (ev.code === "ArrowRight") { seek(v.currentTime + (ev.shiftKey ? 10 : 1)); ev.preventDefault(); }
  // `[` `]`:在预设倍速里挪一格
  if (ev.key === "[") { nudgeRate(-1); ev.preventDefault(); }
  if (ev.key === "]") { nudgeRate(1); ev.preventDefault(); }
  // `t`:切主题
  if (ev.key === "t" || ev.key === "T") { themeBtn.click(); ev.preventDefault(); }
});

/* ── 启动 ────────────────────────────────────────────────── */
window.addEventListener("resize", () => { drawHist(); drawRuler(); });
applyTheme(window.__vidbriefTheme);   // 到这里 off / drawHist 都已经就绪
setPausedUi(v.paused);
drawRuler(); drawShots(); drawSubs(); syncTo(0);
</script>
</body>
</html>
