[package]
name = "vidbrief-mcp"
version.workspace = true
edition.workspace = true
description = "MCP 服务:供材料 + 存结论 + 算法动作 + 提示模板"

[lib]
name = "vidbrief_mcp"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
base64 = "0.23"
chrono.workspace = true
rmcp = { version = "3.1", features = ["transport-io"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
vidbrief-ops.workspace = true
vidbrief-project.workspace = true
