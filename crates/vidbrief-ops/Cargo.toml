[package]
name = "vidbrief-ops"
version.workspace = true
edition.workspace = true
description = "项目上的动作:建项目 / 跑一步 / 取材料 / 存结论 —— CLI 与 MCP 共用的一层"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
# 运行记录里存的是「那一趟跑完的交代」原样(`PreprocessReport` 的 JSON)——
# 让读的人拿到的与直接跑一次拿到的**同源**,不必学两种形状。
serde_json.workspace = true
vidbrief-asr.workspace = true
vidbrief-core.workspace = true
vidbrief-project.workspace = true
vidbrief-report.workspace = true
vidbrief-viz.workspace = true

[features]
# 把测试夹具(见 `src/testkit.rs`)借给别的 crate 用。
#
# 为什么要有这个开关:端到端测试(如 `vidbrief-cli/tests/agent.rs`)需要
# **材料齐全的假项目**,而造它要懂项目目录的全部形状 —— 那属于这一层。
# 与其让每个测试各写一份、各错各的,不如显式借出去。
#
# 不默认打开:它不是库的一部分,"造一个假项目"对使用者没有意义。
testing = []
