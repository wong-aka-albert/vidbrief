[workspace]
resolver = "3"
members = [
    "crates/vidbrief-core",
    "crates/vidbrief-asr",
    "crates/vidbrief-project",
    "crates/vidbrief-viz",
    "crates/vidbrief-report",
    "crates/vidbrief-ops",
    "crates/vidbrief-mcp",
    "crates/vidbrief-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.89 才是真的下限:`rmcp` 要 1.88,而我们用的 `std::fs::File::try_lock`
# (`file_lock` feature)是 **1.89.0** 稳定的 —— 写 1.88 等于骗人:
# 用 1.88 的人 `cargo build` 会撞在"这个 API 不存在"上,而 `rust-version` 本该提前拦住他
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` 不是可有可无的优化,是**正确性**:默认的浮点解析是 best-effort,
# 读回来的 f64 可能与写出去的差 1~2 个 ULP。材料里的 `t`/`gap` 这类算出来的小数
# (如 934.3499999999999)正好落在会中招的那一档,而内容底账把 f64 打进指纹 ——
# 于是"同一份内容、写时一个指纹、读回另一个指纹",门就会误报"材料被人改过"
# (2026-09-28 在一份实测材料上复现,见 docs/devlog)。
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
# 项目状态(state.bin)的载荷编码。选它是因为**位置编码**:字段名不进文件,
# 手写一份"看起来对"的状态基本不可能(JSON 那种自描述格式反倒好改)。
# 代价是它不支持内部标签的枚举(deserialize_any),所以 `Conclusion` 在落盘时
# 换了一套等价表示 —— 见 `vidbrief_project::state` 的 `StoredConclusion`。
bincode = "1.3"
# 本地查看服务:极简同步 HTTP(不需要 async 运行时)
tiny_http = "0.12"
# 渲染后自动打开默认浏览器
open = "5"

# 内部 crate
vidbrief-core = { path = "crates/vidbrief-core" }
vidbrief-asr = { path = "crates/vidbrief-asr" }
vidbrief-project = { path = "crates/vidbrief-project" }
vidbrief-viz = { path = "crates/vidbrief-viz" }
vidbrief-report = { path = "crates/vidbrief-report" }
vidbrief-ops = { path = "crates/vidbrief-ops" }
vidbrief-mcp = { path = "crates/vidbrief-mcp" }
