[workspace]
resolver = "3"
members = [
    "crates/vidbrief-core",
    "crates/vidbrief-asr",
    "crates/vidbrief-project",
    "crates/vidbrief-viz",
    "crates/vidbrief-report",
    "crates/vidbrief-mcp",
    "crates/vidbrief-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
